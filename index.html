<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="morning-bg">

    <div class="d-flex justify-content-center align-items-center min-vh-100 w-100">

        <div class="row border rounded-5 p-3 bg-white shadow box-area">

            <!-- LEFT BOX -->
            <div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box p-4"
                style="background: #103cbe">
                <div class="featured-image mb-3">
                    <img src="logo.png" class="img-fluid" style="width: 250px;">
                </div>
                <p class="text-white fs-2 text-center" style="font-family:'Courier New', Courier, monospace; font-weight: 600;">
                    Be verified
                </p>
                <small class="text-white text-wrap text-center" style="width: 17rem;">
                    Join us on this platform and manage your financial account wisely!
                </small>
            </div>

            <!-- RIGHT BOX -->
            <div class="col-md-6 right-box p-4">
                <form id="loginForm">

                    <p class="fs-4 fw-bold">Hello, Again</p>
                    <p class="text-muted">We are happy to have you back.</p>

                    <!-- USERNAME -->
                    <div class="input-group mb-3">
                        <input type="text" id="username" class="form-control form-control-lg bg-light fs-6"
                            placeholder="Email address" required>
                    </div>

                    <!-- PASSWORD + EYE ICON -->
                    <div class="input-group mb-3">
                        <input type="password" id="password" class="form-control form-control-lg bg-light fs-6"
                            placeholder="Password" required>
                        <span class="input-group-text bg-light" onclick="togglePassword()">
                            <i id="toggleIcon" class="bi bi-eye-fill"></i>
                        </span>
                    </div>

                    <!-- REMEMBER ME -->
                    <div class="input-group mb-4 d-flex justify-content-between">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="formCheck">
                            <label for="formCheck" class="form-check-label text-secondary"><small>Remember Me</small></label>
                        </div>
                    </div>

                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="btn btn-lg btn-primary w-100 fs-6 text-white">
                        Login
                    </button>

                    <!-- SIGN UP BUTTON -->
                    <a href="signup.html" class="btn btn-lg btn-light w-100 fs-6 text-primary mt-3">
                        Sign Up
                    </a>

                </form>
            </div>

        </div>
    </div>

    <!-- WARNING MODAL -->
    <div class="modal fade" id="warningModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Warning</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Incorrect username or password. Please try again.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // LOGIN FUNCTION WITH REDIRECT
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault(); // prevent form from refreshing page

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Hardcoded login validation
            if (username === "Sakinah25" && password === "Nursakinah25!") {
    const loader = document.getElementById("loadingSpinner");
    loader.style.opacity = "1";
    loader.style.pointerEvents = "auto";

    setTimeout(() => {
        window.location.href = "dashboard.html";
    }, 1500);
}else {
                // Show modal if login fails
                const modal = new bootstrap.Modal(document.getElementById('warningModal'));
                modal.show();
            }
        });

        // TOGGLE PASSWORD VISIBILITY
        function togglePassword() {
            const passwordField = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");

            if (passwordField.type === "password") {
                passwordField.type = "text";
                icon.classList.remove("bi-eye-fill");
                icon.classList.add("bi-eye-slash-fill");
            } else {
                passwordField.type = "password";
                icon.classList.remove("bi-eye-slash-fill");
                icon.classList.add("bi-eye-fill");
            }
        }
    </script>

<div id="loadingSpinner" class="loading-spinner">
    <div class="spinner"></div>
</div>

</body>
</html>

<!-- Logout Confirmation Card --><main class="logout-container">
        
        <!-- Themed Icon --><div class="icon-wrapper">
            <!-- Green Checkmark SVG --><svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <!-- Logout Message -->
        <h1 class="title">
            Successfully Logged Out
        </h1>

        <p class="subtitle">
            Thank you for visiting Expenseo.
        </p>
        
        <p class="tagline">
            Spend Wisely. Save Happily.
        </p>

        <!-- Call to Action Button --><!-- Fixed href to point to a relative "index.html" page -->
        <a href="index.html" id="homeButton" class="home-button">
            Return to Homepage
        </a>

        <!-- Automatic Redirect Countdown -->
        <p id="countdown" class="countdown"></p>

    </main>

    <style>
    body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Blue gradient like your login page */
        background: linear-gradient(to bottom right, #e0f2ff, #b5d8ff);
        padding: 1rem;
        margin: 0;
        box-sizing: border-box;
    }

    *, *:before, *:after {
        box-sizing: inherit;
    }

    .logout-container {
        background-color: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(4px);
        border-radius: 1rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
                    0 10px 10px -5px rgba(0, 0, 0, 0.04);
        max-width: 28rem;
        width: 100%;
        margin: auto;
        text-align: center;
        padding: 2rem;
    }

    @media (min-width: 768px) {
        .logout-container {
            padding: 3rem;
        }
    }

    /* Icon Circle */
    .icon-wrapper {
        width: 5rem;
        height: 5rem;
        margin: auto;
        background-color: #e6f2ff; /* light blue */
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 4px rgba(179, 215, 255, 0.7); /* blue ring */
    }

    /* Blue Checkmark */
    .icon {
        width: 4rem;
        height: 4rem;
        color: #1d4ed8; /* deep blue */
    }

    /* Title */
    .title {
        font-size: 1.875rem;
        font-weight: 700;
        color: #1e3a8a; /* dark blue */
        margin-top: 1.5rem;
    }

    .subtitle {
        font-size: 1.125rem;
        color: #374151;
        margin-top: 0.5rem;
    }

    .tagline {
        font-size: 0.875rem;
        color: #1d4ed8;
        margin-top: 0.5rem;
        font-style: italic;
    }

    .home-button {
        margin-top: 2rem;
        display: inline-block;
        width: 100%;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        color: #ffffff;
        background-color: #2563eb; /* main blue */
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1),
                    0 4px 6px -2px rgba(0,0,0,0.05);
        transition: 0.3s;
        text-decoration: none;
    }

    .home-button:hover {
        background-color: #1e40af; /* darker blue */
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1),
                    0 2px 4px -1px rgba(0,0,0,0.06);
    }

    .home-button:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.5);
    }

    .countdown {
        font-size: 0.875rem;
        color: #6b7281;
        margin-top: 1.5rem;
    }

    .countdown-seconds {
        font-weight: 700;
        color: #1e3a8a;
    }
</style>

<script>
        const countdownEl = document.getElementById('countdown');
        const homeButton = document.getElementById('homeButton');
        
        // --- FIX ---
        // Resolve the relative path "index.html" into a full, valid URL
        // based on the current page's *origin*, not its full blob href.
        // The blob: URL was causing an "Invalid URL" error.
        const homeUrl = new URL(homeButton.getAttribute('href'), window.location.origin).href;
        // --- END FIX ---

        let seconds = 7; // Countdown from 7 seconds

        const updateCountdown = () => {
            if (seconds < 0) {
                // When countdown finishes
                clearInterval(interval);
                countdownEl.innerHTML = "Redirecting...";
                
                // --- REAL REDIRECT ---
                // Redirects to the href of the "Return to Homepage" button
                window.location.href = homeUrl;
                
                console.log(`Redirecting to ${homeUrl} now...`);

            } else {
                // Update countdown text
                // Added a span with class for styling the number
                countdownEl.innerHTML = `Redirecting to homepage in <span class="countdown-seconds">${seconds}</span>...`;
                seconds--;
            }
        };

        // Start the countdown immediately on page load
        updateCountdown(); // Call once immediately to show "5"
        const interval = setInterval(updateCountdown, 1000); // Update every second

        // Add click listener to the button
        homeButton.addEventListener('click', (e) => {
            e.preventDefault(); // Stop the link from navigating immediately
            clearInterval(interval); // Stop countdown if button is clicked
            countdownEl.innerHTML = "Taking you home...";
            
            // --- REAL REDIRECT ---
            // Redirects to the href of the button
            window.location.href = homeUrl;
            
            console.log("Homepage button clicked! Redirecting...");
        });
    </script>

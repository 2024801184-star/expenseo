<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="signup.css">
    
</head>

<body>

    <div class="d-flex justify-content-center align-items-center min-vh-100 w-100">

        <div class="row border rounded-5 p-3 bg-white shadow box-area">

            <div class="col p-4">
                <form id="registerForm">

                    <p class="fs-4 fw-bold">Let's get you signed up!</p>
                    
                    <div class="mb-3">
                        <label for="pwd" class="form-label">First Name:</label>
                        <input type="text" id="first name" class="form-control form-control-lg bg-light fs-6" required>
                    </div>

                    <div class="mb-3">
                        <label for="pwd" class="form-label">Last Name:</label>
                        <input type="text" id="last name" class="form-control form-control-lg bg-light fs-6" required>
                    </div>

                    <div class="mb-3">
                        <label for="pwd" class="form-label">Username:</label>
                        <input type="text" id="username" class="form-control form-control-lg bg-light fs-6" required>
                    </div>

                    <div class="mb-3">
                        <label for="pwd" class="form-label">Password:</label>
                        <input type="text" id="password" class="form-control form-control-lg bg-light fs-6" required>
                    </div>

                    <div class="mb-3">
                        <label for="pwd" class="form-label">Confirm Password:</label>
                        <input type="text" id="confirm password" class="form-control form-control-lg bg-light fs-6" required>
                    </div>

                    <!-- REGISTER BUTTON -->
                     <div class="div-class mt-4">
                        <button type="button" class="btn btn-lg btn-primary w-100 fs-6 text-white"
                            onclick="window.location.href='index.html'">
                        Sign Up
                    </button>
                     </div>



                </form>
            </div>

        </div>
    </div>

    <!-- WARNING MODAL -->
    <div class="modal fade" id="warningModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Warning</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Incorrect username or password. Please try again.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
